name: CS2 Autoposter deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cs2-autoposter-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cs2-autoposter
    defaults:
      run:
        working-directory: cs2-autoposter
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/banannews-telegram-monitor-lrrhnv
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cs2-autoposter/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Apply deployment-specific database ID
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8")); if(!/^[0-9a-f-]{36}$/.test(process.env.D1_DATABASE_ID||"")) throw Error("D1_DATABASE_ID required"); c.d1_databases[0].database_id=process.env.D1_DATABASE_ID; fs.writeFileSync("wrangler.jsonc",JSON.stringify(c,null,2));'
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npm run deploy
