name: TikTok

on:
  schedule:
    - cron: "37 * * * *"   # каждый час: новые новости канала -> TikTok
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Код с страницы tiktok-callback (только при подключении TikTok)"
        required: false

permissions:
  contents: write

concurrency:
  group: tiktok
  cancel-in-progress: false

jobs:
  tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_STATE_KEY: ${{ secrets.TIKTOK_STATE_KEY }}
      TELEGRAM_CHANNEL: "@BananNewws"
      PAGES_URL: "https://nem1k9.github.io/banananews"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: git identity
        run: git config --global user.name "banan-bot" && git config --global user.email "banan-bot@users.noreply.github.com"

      # однократное подключение TikTok
      - if: github.event.inputs.auth_code != ''
        env:
          AUTH_CODE: ${{ github.event.inputs.auth_code }}
        run: |
          echo "::add-mask::$AUTH_CODE"
          python3 tiktok.py auth "$AUTH_CODE"
          git add tiktok_state.enc && git commit -qm "TikTok: подключён" && git push -q

      # каждая новая новость канала -> отдельный пост в TikTok
      - if: github.event.inputs.auth_code == ''
        id: check
        run: |
          git fetch -q origin gh-pages && git worktree add -q pages origin/gh-pages && (cd pages && git checkout -q -B gh-pages)
          if [ -f tiktok_state.enc ]; then python3 tiktok.py check pages; else echo "TikTok не подключён"; echo "has_new=false" >> $GITHUB_OUTPUT; fi
      - if: steps.check.outputs.has_new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - if: steps.check.outputs.has_new == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.48.2
      - if: steps.check.outputs.has_new == 'true'
        run: |
          npm i --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          python3 tiktok.py build pages
          cd pages && git add -A && (git diff --cached --quiet || (git commit -qm "TikTok: картинки" && git push -q origin gh-pages))
      - if: steps.check.outputs.has_new == 'true'
        run: |
          python3 tiktok.py publish pages
          (cd pages && git add -A && (git diff --cached --quiet || (git commit -qm "TikTok: опубликовано" && for i in 1 2 3; do git pull -q --rebase origin gh-pages && git push -q origin gh-pages && break; sleep 5; done)))
          git add tiktok_state.enc && (git diff --cached --quiet || (git commit -qm "TikTok: обновлён токен" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done))
