name: Автопостер (live-счёт, результаты, опросы)

# Основной автопостер матчей крутится в облачной сессии Claude (/loop: auto.py --loop).
# Здесь только ручной запуск как запасной вариант, чтобы два автопостера не дублировали посты.
on:
  workflow_dispatch:

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: "@BananNewws"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - id: check
        run: python3 auto.py --check
      - if: steps.check.outputs.has_work == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - if: steps.check.outputs.has_work == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.48.2
      - if: steps.check.outputs.has_work == 'true'
        run: |
          npm i --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
      # пока идут известные матчи — задача не завершается и проверяет счёт каждые 20 с
      - if: steps.check.outputs.has_work == 'true'
        run: python3 -u auto.py --loop 19800
