<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.photo{position:absolute;left:-60px;bottom:110px;height:880px;z-index:2;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent 92%),linear-gradient(0deg,transparent 0,#000 12%);-webkit-mask-composite:source-in;mask-composite:intersect}
.fade{position:absolute;left:380px;top:0;bottom:110px;width:220px;background:linear-gradient(90deg,transparent,var(--bg));z-index:3}
.col{position:absolute;left:500px;right:56px;top:170px;bottom:150px;z-index:4;display:flex;flex-direction:column;justify-content:center}
.qmark{display:flex;gap:10px;margin-bottom:28px}
.qmark i{width:18px;height:58px;background:#fff;transform:skewX(-18deg)}
.qmark i:nth-child(2){background:var(--acc)}
.text{font:900 60px/1.04 Montserrat;text-transform:uppercase;letter-spacing:-.5px}
.who{margin-top:32px;font:900 28px Montserrat;text-transform:uppercase;letter-spacing:1px}
.who b{color:var(--acc);font-weight:900}
.logo-tl{position:absolute;top:44px;left:56px;width:96px;height:80px;z-index:5}
</style></head><body><div id="card"><div class="bgfx"></div>
<img class="logo-tl" src="../assets/logo.svg">
<img class="photo" id="ph">
<div class="col"><div class="qmark"><i></i><i></i></div><div class="text" id="tx"></div><div class="who" id="who"></div></div>
<div class="bar"></div><div class="bottom"><div class="brand">БАНАН <b>NEWS</b></div><div class="kind" id="kind"></div></div>
</div><script>
const D=window.DATA;kind.textContent=D.kind||'Цитата';
ph.src=D.person.photo||'../assets/avatar.png';
tx.textContent=D.quote;
const role=D.person.role||'';
who.innerHTML=D.person.nick+(role?' '+role.replace(/(\S+)$/,'<b>$1</b>'):'');
document.fonts.ready.then(()=>{const box=document.querySelector('.col');let fs=60;
 while(box.scrollHeight>box.clientHeight&&fs>30){fs-=2;tx.style.fontSize=fs+'px'}});
</script></body></html>
