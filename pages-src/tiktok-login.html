<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>БАНАН NEWS · TikTok</title>
<style>body{background:#0b0b0d;color:#fff;font:16px system-ui;max-width:560px;margin:40px auto;padding:0 16px}input,button{font:inherit;padding:12px;border-radius:8px;border:0;width:100%;box-sizing:border-box;margin-top:10px}button{background:#FFC928;font-weight:700;cursor:pointer}</style></head>
<body><h2>Подключить TikTok к БАНАН NEWS</h2>
<p>Вставьте <b>Client key</b> вашего приложения из TikTok for Developers и нажмите кнопку. Откроется вход в TikTok.</p>
<input id="k" placeholder="Client key"><button onclick="go()">Войти через TikTok</button>
<script>function go(){const k=document.getElementById('k').value.trim();if(!k)return;
const r=location.href.replace(/tiktok-login\.html.*$/,'tiktok-callback.html');
location.href='https://www.tiktok.com/v2/auth/authorize/?client_key='+encodeURIComponent(k)+'&scope=user.info.basic,video.publish&response_type=code&redirect_uri='+encodeURIComponent(r)+'&state=banan'}</script></body></html>
